parameters:
  dotnetSdkVersion: '10.0.x'
  buildConfiguration: 'Release'
  apiProject: ''
  webBuildOutput: 'dist'
  webClientPath: ''
  artifactName: 'drop'

jobs:
  - job: PackageApi
    displayName: 'Package API with React assets'
    pool:
        name: SelfHosted
    steps:
      - checkout: self

      - task: UseDotNet@2
        displayName: 'Use .NET SDK'
        inputs:
          packageType: 'sdk'
          version: ${{ parameters.dotnetSdkVersion }}

      - task: DownloadPipelineArtifact@2
        displayName: 'Download frontend build'
        inputs:
          artifact: 'web-dist'
          path: '$(Pipeline.Workspace)/web-dist'

      - task: PowerShell@2
        displayName: 'Copy React build to wwwroot'
        inputs:
          targetType: 'inline'
          script: |
            $wwwrootPath = "src/Presentation/API/wwwroot"

            if (Test-Path $wwwrootPath) {
                Remove-Item -Path $wwwrootPath -Recurse -Force
                Write-Host "Removed existing wwwroot folder"
            }

            New-Item -ItemType Directory -Path $wwwrootPath -Force | Out-Null
            Write-Host "Created wwwroot folder"

            $sourcePath = "$(Pipeline.Workspace)/web-dist/*"
            Copy-Item -Path $sourcePath -Destination $wwwrootPath -Recurse -Force
            Write-Host "Copied React build to wwwroot"

            $fileCount = (Get-ChildItem -Path $wwwrootPath -Recurse -File).Count
            Write-Host "Copied $fileCount files to wwwroot"

      - task: DotNetCoreCLI@2
        displayName: 'Publish API'
        inputs:
          command: 'publish'
          publishWebProjects: false
          projects: ${{ parameters.apiProject }}
          arguments: '--configuration ${{ parameters.buildConfiguration }} --output $(Build.ArtifactStagingDirectory)/api'

      - task: PublishPipelineArtifact@1
        displayName: 'Publish deployment artifact'
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/api'
          artifact: ${{ parameters.artifactName }}
