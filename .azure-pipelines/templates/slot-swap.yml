parameters:
  azureServiceConnection: ''
  resourceGroup: ''
  webAppName: ''
  sourceSlot: 'staging'
  targetSlot: 'production'
  environmentName: ''

jobs:
  - deployment: SlotSwap
    displayName: 'Swap deployment slots'
    environment: ${{ parameters.environmentName }}
    pool:
        name: SelfHosted
    strategy:
      runOnce:
        deploy:
          steps:
            # Pre-swap health check on staging slot
            - task: AzureCLI@2
              displayName: 'Verify staging slot health'
              inputs:
                azureSubscription: ${{ parameters.azureServiceConnection }}
                scriptType: 'pscore'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  Write-Host "Checking staging slot health..."
                  $slotUrl = "https://${{ parameters.webAppName }}-${{ parameters.sourceSlot }}.azurewebsites.net/health"

                  $maxRetries = 5
                  $retryCount = 0

                  while ($retryCount -lt $maxRetries) {
                      try {
                          $response = Invoke-WebRequest -Uri $slotUrl -Method Get -TimeoutSec 30 -UseBasicParsing
                          if ($response.StatusCode -eq 200) {
                              Write-Host "Staging slot is healthy (HTTP $($response.StatusCode))"
                              exit 0
                          }
                      } catch {
                          $statusCode = $_.Exception.Response.StatusCode.value__
                          Write-Host "Health check attempt $($retryCount + 1) failed (HTTP $statusCode). Retrying in 10s..."
                      }

                      $retryCount++
                      Start-Sleep -Seconds 10
                  }

                  Write-Host "##vso[task.logissue type=error]Staging slot health check failed after $maxRetries attempts"
                  exit 1

            # Perform slot swap
            - task: AzureAppServiceManage@0
              displayName: 'Swap staging to production'
              inputs:
                azureSubscription: ${{ parameters.azureServiceConnection }}
                Action: 'Swap Slots'
                WebAppName: ${{ parameters.webAppName }}
                ResourceGroupName: ${{ parameters.resourceGroup }}
                SourceSlot: ${{ parameters.sourceSlot }}
                SwapWithProduction: true
                PreserveVnet: true

            # Post-swap health check on production
            - task: AzureCLI@2
              displayName: 'Verify production health post-swap'
              inputs:
                azureSubscription: ${{ parameters.azureServiceConnection }}
                scriptType: 'pscore'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  Write-Host "Verifying production health after swap..."
                  $prodUrl = "https://${{ parameters.webAppName }}.azurewebsites.net/health"

                  $maxRetries = 5
                  $retryCount = 0

                  while ($retryCount -lt $maxRetries) {
                      try {
                          $response = Invoke-WebRequest -Uri $prodUrl -Method Get -TimeoutSec 30 -UseBasicParsing
                          if ($response.StatusCode -eq 200) {
                              Write-Host "Production is healthy (HTTP $($response.StatusCode))"
                              exit 0
                          }
                      } catch {
                          $statusCode = $_.Exception.Response.StatusCode.value__
                          Write-Host "Health check attempt $($retryCount + 1) failed (HTTP $statusCode). Retrying in 10s..."
                      }

                      $retryCount++
                      Start-Sleep -Seconds 10
                  }

                  Write-Host "##vso[task.logissue type=error]Production health check failed after swap - consider rollback"
                  exit 1
