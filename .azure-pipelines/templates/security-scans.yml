parameters:
  runSonar: false
  solution: ''
  buildConfiguration: 'Release'
  dotnetSdkVersion: '10.0.x'
  sonarServiceConnection: ''
  sonarOrganization: ''
  sonarProjectKey: ''
  sonarProjectName: ''
  # Parameters for npm audit
  nodeVersion: '20.x'
  webClientPath: ''

jobs:
  - job: DevSecOps
    displayName: 'SonarCloud and Gitleaks'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: UseDotNet@2
        displayName: 'Use .NET SDK'
        inputs:
          packageType: 'sdk'
          version: ${{ parameters.dotnetSdkVersion }}

      - ${{ if eq(parameters.runSonar, true) }}:
        - task: SonarQubeCloudPrepare@1
          displayName: 'Prepare SonarQube Cloud analysis'
          inputs:
            SonarQubeCloud: ${{ parameters.sonarServiceConnection }}
            organization: ${{ parameters.sonarOrganization }}
            scannerMode: 'MSBuild'
            projectKey: ${{ parameters.sonarProjectKey }}
            projectName: ${{ parameters.sonarProjectName }}

        - task: DotNetCoreCLI@2
          displayName: 'Build for analysis'
          inputs:
            command: 'build'
            projects: ${{ parameters.solution }}
            arguments: '--configuration ${{ parameters.buildConfiguration }}'

        - task: SonarQubeCloudAnalyze@1
          displayName: 'Run SonarQube Cloud analysis'

        - task: SonarQubeCloudPublish@1
          displayName: 'Publish SonarQube Cloud quality gate'
          inputs:
            pollingTimeoutSec: '300'

        - task: DotNetCoreCLI@2
          displayName: 'Build (no sonar)'
          inputs:
            command: 'build'
            projects: ${{ parameters.solution }}
            arguments: '--configuration ${{ parameters.buildConfiguration }}'

      - script: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.1/gitleaks_8.21.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --report-format sarif --report-path $(Build.ArtifactStagingDirectory)/gitleaks.sarif
        displayName: 'Gitleaks scan'

      - task: PublishPipelineArtifact@1
        displayName: 'Publish gitleaks report'
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/gitleaks.sarif'
          artifact: 'gitleaks-report'



  # NPM Audit job for dependency vulnerability scanning
  - job: NpmAudit
    displayName: 'NPM Dependency Audit'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: NodeTool@0
        displayName: 'Use Node.js'
        inputs:
          versionSpec: ${{ parameters.nodeVersion }}

      - script: npm ci
        displayName: 'Install dependencies'
        workingDirectory: ${{ parameters.webClientPath }}

      - script: |
          echo "Running npm audit..."
          npm audit --audit-level=moderate --json > $(Build.ArtifactStagingDirectory)/npm-audit.json || true

          # Run audit and capture exit code
          npm audit --audit-level=moderate
          AUDIT_EXIT_CODE=$?

          if [ $AUDIT_EXIT_CODE -gt 0 ]; then
            echo "##vso[task.logissue type=warning]npm audit found vulnerabilities (exit code: $AUDIT_EXIT_CODE)"
          else
            echo "No vulnerabilities found"
          fi

          # Don't fail the pipeline on vulnerabilities, just warn
          exit 0
        displayName: 'Run npm audit'
        workingDirectory: ${{ parameters.webClientPath }}

      - task: PublishPipelineArtifact@1
        displayName: 'Publish npm audit report'
        condition: always()
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/npm-audit.json'
          artifact: 'npm-audit-report'
