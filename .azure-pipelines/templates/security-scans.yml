parameters:
  runSonar: false
  solution: ''
  buildConfiguration: 'Release'
  dotnetSdkVersion: '10.0.x'
  sonarServiceConnection: ''
  sonarOrganization: ''
  sonarProjectKey: ''
  sonarProjectName: ''
  # Parameters for npm audit
  nodeVersion: '20.x'
  webClientPath: ''

jobs:
  - job: DevSecOps
    displayName: 'SonarCloud and Gitleaks'
    pool:
        name: SelfHosted
    steps:
      - task: UseDotNet@2
        displayName: 'Use .NET SDK'
        inputs:
          packageType: 'sdk'
          version: ${{ parameters.dotnetSdkVersion }}

      - ${{ if eq(parameters.runSonar, true) }}:
        - task: SonarQubeCloudPrepare@1
          displayName: 'Prepare SonarQube Cloud analysis'
          inputs:
            SonarQubeCloud: ${{ parameters.sonarServiceConnection }}
            organization: ${{ parameters.sonarOrganization }}
            scannerMode: 'MSBuild'
            projectKey: ${{ parameters.sonarProjectKey }}
            projectName: ${{ parameters.sonarProjectName }}

        - task: DotNetCoreCLI@2
          displayName: 'Build for analysis'
          inputs:
            command: 'build'
            projects: ${{ parameters.solution }}
            arguments: '--configuration ${{ parameters.buildConfiguration }}'

        - task: SonarQubeCloudAnalyze@1
          displayName: 'Run SonarQube Cloud analysis'

        - task: SonarQubeCloudPublish@1
          displayName: 'Publish SonarQube Cloud quality gate'
          inputs:
            pollingTimeoutSec: '300'

        - task: DotNetCoreCLI@2
          displayName: 'Build (no sonar)'
          inputs:
            command: 'build'
            projects: ${{ parameters.solution }}
            arguments: '--configuration ${{ parameters.buildConfiguration }}'

      - task: PowerShell@2
        displayName: 'Gitleaks scan'
        inputs:
          targetType: 'inline'
          script: |
            $ErrorActionPreference = "Continue"
            $gitleaksVersion = "8.21.1"
            $gitleaksUrl = "https://github.com/gitleaks/gitleaks/releases/download/v$gitleaksVersion/gitleaks_${gitleaksVersion}_windows_x64.zip"
            $gitleaksZip = "gitleaks.zip"

            Write-Host "Downloading Gitleaks $gitleaksVersion for Windows..."
            Invoke-WebRequest -Uri $gitleaksUrl -OutFile $gitleaksZip

            Write-Host "Extracting Gitleaks..."
            Expand-Archive -Path $gitleaksZip -DestinationPath . -Force

            Write-Host "Running Gitleaks scan..."
            $reportPath = "$(Build.ArtifactStagingDirectory)/gitleaks.sarif"

            # Run gitleaks and capture exit code
            .\gitleaks.exe detect --source . --report-format sarif --report-path $reportPath
            $gitleaksExitCode = $LASTEXITCODE

            if ($gitleaksExitCode -eq 1) {
                Write-Host "##vso[task.logissue type=warning]Gitleaks found potential secrets in the codebase. Review the SARIF report for details."
                Write-Host "Gitleaks scan completed with warnings (leaks detected)"
            } elseif ($gitleaksExitCode -eq 0) {
                Write-Host "Gitleaks scan completed successfully - no leaks detected"
            } else {
                Write-Host "##vso[task.logissue type=error]Gitleaks scan failed with exit code: $gitleaksExitCode"
                exit $gitleaksExitCode
            }

            # Don't fail the pipeline on detected secrets, just warn
            exit 0

      - task: PublishPipelineArtifact@1
        displayName: 'Publish gitleaks report'
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/gitleaks.sarif'
          artifact: 'gitleaks-report'



  # NPM Audit job for dependency vulnerability scanning
  - job: NpmAudit
    displayName: 'NPM Dependency Audit'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - task: NodeTool@0
        displayName: 'Use Node.js'
        inputs:
          versionSpec: ${{ parameters.nodeVersion }}

      - script: npm ci
        displayName: 'Install dependencies'
        workingDirectory: ${{ parameters.webClientPath }}

      - script: |
          echo "Running npm audit..."

          # Ensure staging directory exists
          mkdir -p $(Build.ArtifactStagingDirectory)

          # Run npm audit and capture output to JSON file
          npm audit --audit-level=moderate --json > $(Build.ArtifactStagingDirectory)/npm-audit.json 2>&1 || true

          # Verify file was created
          if [ ! -f "$(Build.ArtifactStagingDirectory)/npm-audit.json" ]; then
            echo '{"error": "npm audit failed to generate report"}' > $(Build.ArtifactStagingDirectory)/npm-audit.json
          fi

          # Run audit again to show results in console and capture exit code
          npm audit --audit-level=moderate || AUDIT_EXIT_CODE=$?

          if [ "${AUDIT_EXIT_CODE:-0}" -gt 0 ]; then
            echo "##vso[task.logissue type=warning]npm audit found vulnerabilities (exit code: $AUDIT_EXIT_CODE)"
          else
            echo "No vulnerabilities found"
          fi

          # Don't fail the pipeline on vulnerabilities, just warn
          exit 0
        displayName: 'Run npm audit'
        workingDirectory: ${{ parameters.webClientPath }}

      - task: PublishPipelineArtifact@1
        displayName: 'Publish npm audit report'
        condition: always()
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/npm-audit.json'
          artifact: 'npm-audit-report'
