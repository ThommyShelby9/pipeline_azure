parameters:
  nodeVersion: '20.x'
  webClientPath: ''
  webBuildOutput: 'dist'
  runTests: true
  runLint: true

jobs:
  - job: BuildFrontend
    displayName: 'Build React frontend'
    pool:
        name: SelfHosted
    steps:
      - task: NodeTool@0
        displayName: 'Use Node.js'
        inputs:
          versionSpec: ${{ parameters.nodeVersion }}

      - script: npm ci
        displayName: 'Install dependencies'
        workingDirectory: ${{ parameters.webClientPath }}

      # ESLint - Code quality gate
      - ${{ if eq(parameters.runLint, true) }}:
        - script: npm run lint
          displayName: 'Run ESLint'
          workingDirectory: ${{ parameters.webClientPath }}

      # TypeScript type checking
      - script: npm run type-check
        displayName: 'TypeScript type check'
        workingDirectory: ${{ parameters.webClientPath }}

      # Unit tests with coverage
      - ${{ if eq(parameters.runTests, true) }}:
        - script: npm run test -- --reporter=junit --outputFile=test-results.xml --run
          displayName: 'Run unit tests'
          workingDirectory: ${{ parameters.webClientPath }}
          continueOnError: true

        - task: PublishTestResults@2
          displayName: 'Publish test results'
          condition: always()
          inputs:
            testResultsFormat: 'JUnit'
            testResultsFiles: '${{ parameters.webClientPath }}/test-results.xml'
            testRunTitle: 'Frontend Unit Tests'
            failTaskOnFailedTests: true

        - script: npm run test:coverage -- --run
          displayName: 'Generate coverage report'
          workingDirectory: ${{ parameters.webClientPath }}
          continueOnError: true

      # Production build
      - script: npm run build
        displayName: 'Build frontend'
        workingDirectory: ${{ parameters.webClientPath }}

      - task: PublishPipelineArtifact@1
        displayName: 'Publish frontend artifact'
        inputs:
          targetPath: '${{ parameters.webClientPath }}/${{ parameters.webBuildOutput }}'
          artifact: 'web-dist'
