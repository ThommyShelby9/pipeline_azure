trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

variables:
  buildConfiguration: 'Release'
  dotnetSdkVersion: '8.0.x'
  nodeVersion: '20.x'
  solution: 'ShoppingProject.sln'
  apiProject: 'src/Presentation/API/ShoppingProject.WebApi.csproj'
  webClientPath: 'src/Presentation/Web'
  webBuildOutput: 'dist'
  artifactName: 'drop'
  runIaC: 'true'

  # SonarQube configuration
  sonarServiceConnection: 'SonarQubeCloud'
  sonarOrganization: 'securefintech'
  sonarProjectKey: 'securefintech-shoppingproject'
  sonarProjectName: 'ShoppingProject'

  # Azure configuration
  azureServiceConnection: 'azure-securefintech-oidc'
  resourceGroup: 'rg-securefintech'
  location: 'eastus'
  keyVaultName: 'kv-securefintech'
  webAppName: 'securefintech-api'
  slotName: 'staging'

stages:
  # ===========================================
  # Stage 1: Infrastructure (IaC) - US-01
  # ===========================================
  - stage: Infrastructure
    displayName: 'Infrastructure (IaC)'
    condition: and(succeeded(), eq(variables['runIaC'], 'true'))
    jobs:
      - template: .azure-pipelines/templates/deploy-infra.yml
        parameters:
          azureServiceConnection: $(azureServiceConnection)
          resourceGroup: $(resourceGroup)
          location: $(location)
          bicepFile: infra/main.bicep
          environmentName: 'securefintech'
          principalId: $(principalId)
          dbAdminPassword: $(dbAdminPassword)
          dbAppUserPassword: $(dbAppUserPassword)

  # ===========================================
  # Stage 2: Build .NET - US-02
  # ===========================================
  - stage: Build
    displayName: 'Build (.NET)'
    jobs:
      - template: .azure-pipelines/templates/build-dotnet.yml
        parameters:
          solution: $(solution)
          buildConfiguration: $(buildConfiguration)
          dotnetSdkVersion: $(dotnetSdkVersion)

  # ===========================================
  # Stage 3: Build React (with lint, tests) - US-02
  # ===========================================
  - stage: Frontend
    displayName: 'Build (React)'
    jobs:
      - template: .azure-pipelines/templates/build-frontend.yml
        parameters:
          nodeVersion: $(nodeVersion)
          webClientPath: $(webClientPath)
          webBuildOutput: $(webBuildOutput)
          runTests: true
          runLint: true

  # ===========================================
  # Stage 4: DevSecOps (SonarCloud + Gitleaks + npm audit) - US-03
  # ===========================================
  - stage: DevSecOps
    displayName: 'DevSecOps (SonarCloud + Gitleaks + npm audit)'
    dependsOn:
      - Build
    jobs:
      - template: .azure-pipelines/templates/security-scans.yml
        parameters:
          runSonar: false
          solution: $(solution)
          buildConfiguration: $(buildConfiguration)
          dotnetSdkVersion: $(dotnetSdkVersion)
          sonarServiceConnection: $(sonarServiceConnection)
          sonarOrganization: $(sonarOrganization)
          sonarProjectKey: $(sonarProjectKey)
          sonarProjectName: $(sonarProjectName)
          nodeVersion: $(nodeVersion)
          webClientPath: $(webClientPath)

  # ===========================================
  # Stage 5: Package API + React
  # ===========================================
  - stage: Package
    displayName: 'Package (API + React)'
    dependsOn:
      - Build
      - Frontend
    jobs:
      - template: .azure-pipelines/templates/package-api.yml
        parameters:
          dotnetSdkVersion: $(dotnetSdkVersion)
          buildConfiguration: $(buildConfiguration)
          apiProject: $(apiProject)
          webBuildOutput: $(webBuildOutput)
          webClientPath: $(webClientPath)
          artifactName: $(artifactName)

  # ===========================================
  # Stage 6: Deploy to Staging Slot - US-04
  # ===========================================
  - stage: Deploy_Staging
    displayName: 'Deploy (Staging Slot)'
    dependsOn:
      - Package
      - DevSecOps
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/develop'), eq(variables['Build.SourceBranch'], 'refs/heads/main')))
    jobs:
      - template: .azure-pipelines/templates/deploy-webapp.yml
        parameters:
          environmentName: 'staging'
          azureServiceConnection: $(azureServiceConnection)
          keyVaultName: $(keyVaultName)
          webAppName: $(webAppName)
          deployToSlot: true
          slotName: $(slotName)
          artifactName: $(artifactName)

  # ===========================================
  # Stage 7: Smoke Tests on Staging - US-04
  # ===========================================
  - stage: SmokeTests_Staging
    displayName: 'Smoke Tests (Staging)'
    dependsOn:
      - Deploy_Staging
    condition: succeeded()
    jobs:
      - template: .azure-pipelines/templates/smoke-tests.yml
        parameters:
          baseUrl: 'https://$(webAppName)-$(slotName).azurewebsites.net'
          environmentName: 'staging'

  # ===========================================
  # Stage 8: Slot Swap (Blue-Green) - US-04
  # Only on main branch after staging smoke tests pass
  # ===========================================
  - stage: SlotSwap
    displayName: 'Slot Swap (Production)'
    dependsOn:
      - SmokeTests_Staging
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - template: .azure-pipelines/templates/slot-swap.yml
        parameters:
          azureServiceConnection: $(azureServiceConnection)
          resourceGroup: $(resourceGroup)
          webAppName: $(webAppName)
          sourceSlot: $(slotName)
          targetSlot: 'production'
          environmentName: 'production'

  # ===========================================
  # Stage 9: Smoke Tests on Production - US-04
  # ===========================================
  - stage: SmokeTests_Production
    displayName: 'Smoke Tests (Production)'
    dependsOn:
      - SlotSwap
    condition: succeeded()
    jobs:
      - template: .azure-pipelines/templates/smoke-tests.yml
        parameters:
          baseUrl: 'https://$(webAppName).azurewebsites.net'
          environmentName: 'production'
